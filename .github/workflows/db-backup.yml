name: Back up database

# Read-only nightly snapshot of the live Supabase project, pushed to the
# PRIVATE repo BorisVDH-pcs/hs-events-db-backups. The dumps contain profile
# and account data, so they must never land in this public repo.
#
# This workflow only ever reads: `link` and `db dump`, never `db push` and
# never `db reset`. It has its own concurrency group so it can never
# interleave with a migration push.

on:
  schedule:
    # 02:00 UTC -> 03:00 Amsterdam in winter, 04:00 in summer. Deliberately
    # the quiet window: the project runs on Nano with very little memory
    # headroom, so the dump should not compete with event-night traffic.
    #
    # GitHub treats scheduled runs as best-effort and defers them under load:
    # the 2026-10-27 run was queued for 02:00 and started at 07:31 UTC. Nothing
    # to fix there, but do not read a late run as a broken one.
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: supabase-db-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To raise, and later close, the "backup is failing" issue below.
      issues: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      # Checked first, and on its own, because the credential it guards is not
      # touched until the very last step. Without this the job spends two and a
      # half minutes dumping a live database and only then falls over on a bare
      # `Permission denied (publickey)` that names nothing. The secret was in
      # fact missing for the whole of the workflow's first day, so this is the
      # failure to make legible rather than a hypothetical one.
      - name: Check the publish credential is present
        env:
          DEPLOY_KEY: ${{ secrets.BACKUP_REPO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::error::Secret BACKUP_REPO_DEPLOY_KEY is not set, so a snapshot could not be published even if the dump succeeded. Add the private half of the 'hs-events backup writer' deploy key on BorisVDH-pcs/hs-events-db-backups as an Actions secret on this repo."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`. This is the only backup of the database, and
          # the sanity check downstream reads the CLI's own dump output, so a
          # release that reshapes that output moves the backup without anyone
          # choosing to move it. Bump deliberately, with a manual run after.
          version: 2.122.0

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # `--linked` is the default today, so it changes nothing now. It is here
      # because the CLI prints a warning on every single run that the next
      # major version will target the LOCAL database by default. A runner has
      # no local database, so on that release the dumps would quietly become
      # dumps of nothing - and the sanity check would catch it, but only after
      # the fact. Pinning the version above means that day can only arrive via
      # a deliberate bump; this flag means the bump is survivable.
      - name: Dump roles, schema and data
        run: |
          set -euo pipefail
          mkdir -p out
          supabase db dump --linked --role-only --file out/roles.sql
          supabase db dump --linked             --file out/schema.sql
          supabase db dump --linked --data-only --file out/data.sql
          ls -l out

      - name: Sanity-check the dumps
        run: |
          set -euo pipefail
          # A dump that silently produced nothing is worse than no backup at
          # all, because it looks like success. Check each file for a marker
          # proving it holds what it should. Size alone is a bad signal: a
          # healthy --role-only dump is only a few hundred bytes.
          check() {
            file="out/$1.sql"; min="$2"; marker="$3"
            size=$(stat -c%s "$file")
            echo "$1.sql: $size bytes"
            if [ "$size" -lt "$min" ]; then
              echo "::error::$file is only $size bytes - refusing to publish a suspect backup"
              exit 1
            fi
            if ! grep -qE "$marker" "$file"; then
              echo "::error::$file has no /$marker/ - refusing to publish a suspect backup"
              exit 1
            fi
          }
          check roles   100  'ROLE'
          check schema  1024 'CREATE TABLE'
          check data    1024 '^(COPY|INSERT)'

      - name: Publish to the private backup repo
        env:
          DEPLOY_KEY: ${{ secrets.BACKUP_REPO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          git clone --depth 1 \
            git@github.com:BorisVDH-pcs/hs-events-db-backups.git backup-repo

          # Always write the same three paths. Each commit is a full snapshot
          # and git delta-compresses the day-to-day difference, which keeps the
          # repo small; the history is the time dimension, so restoring a given
          # day means checking out that day's commit.
          cp out/roles.sql out/schema.sql out/data.sql backup-repo/
          cd backup-repo

          {
            echo "Snapshot:  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Source:    High Society Events, eu-west-2"
            echo "Run:       ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Sizes:"
            for f in roles schema data; do
              printf '  %-12s %10s bytes\n' "$f.sql" "$(stat -c%s "$f.sql")"
            done
          } > MANIFEST.txt

          git config user.name  "hs-events backup bot"
          git config user.email "actions@github.com"
          git add -A

          # MANIFEST.txt changes every run, so compare only the dumps.
          if git diff --cached --quiet -- roles.sql schema.sql data.sql; then
            echo "Database unchanged since the last snapshot - nothing to commit."
            exit 0
          fi

          git commit -m "Snapshot $(date -u +%Y-%m-%d)" -m "Taken by run ${GITHUB_RUN_ID}."
          git push origin HEAD:main
          echo "Pushed $(git rev-parse --short HEAD)"

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Database backup"
            echo
            echo "Destination: \`BorisVDH-pcs/hs-events-db-backups\` (private)"
            if [ -d out ]; then
              echo
              echo "| file | bytes |"
              echo "|---|---|"
              for f in roles schema data; do
                [ -f "out/$f.sql" ] && echo "| $f.sql | $(stat -c%s "out/$f.sql") |"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The two steps below matter as much as the dump does. A backup nobody is
      # told about is a backup nobody knows is missing: this workflow failed on
      # its first scheduled run and stayed that way, unnoticed, until someone
      # opened the Actions tab for an unrelated reason. The step summary above
      # is only read by whoever already went looking.
      #
      # An issue, rather than mail or a webhook: it needs no new secret, GitHub
      # mails the repo owner about it anyway, and - unlike a notification - it
      # stays open as a standing reminder until a backup actually succeeds, so
      # a week of silent failures cannot look like a week of quiet success.
      # Titles are matched exactly, so that week is one thread with seven
      # comments rather than seven threads.
      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          # This job deliberately never checks the repo out - it needs none of
          # it - so `gh` has no git remote to infer the repository from and
          # would exit "not a git repository". GH_REPO tells it directly.
          GH_REPO: ${{ github.repository }}
          TITLE: Database backup is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Listed and filtered rather than searched: the issue search index
          # lags by minutes, which is long enough to open a duplicate.
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')

          body=$(printf '%s\n' \
            "The scheduled backup did not publish a snapshot." \
            "" \
            "Run: $RUN_URL" \
            "" \
            "Nothing was written to the backup repo for this run, and nothing" \
            "there was overwritten - the newest snapshot it holds is still" \
            "whatever the last successful run left. Check how old that is.")

          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            echo "Commented on #$number."
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

      - name: Close the failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Database backup is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Backup succeeded again: $RUN_URL"
          fi
